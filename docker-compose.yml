services:
  # No host port: nginx is the sole public entry point, matching prod.
  # TEMP (local debug only, revert before committing): expose eXist
  # directly on 8082 for xst/ant deploy access.
  betmas:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: ghcr.io/betamasaheft/betamasaheft:release-expanded
    ports:
      - "8082:8080"
    environment:
      # nginx is the sole public entry point (proxies "/" to this app), so
      # the app's externally-visible base is root now, not its own eXist
      # mount path.
      APP_URL: http://localhost:8080
      # Only reachable with the full profile (fuseki isn't in core), but
      # harmless to set unconditionally - config:service-url() only
      # resolves this when something actually calls out to Fuseki.
      FUSEKI_URL: http://fuseki:3030/
      # Same story as FUSEKI_URL above - only live under the full profile,
      # harmless otherwise. Matches collatex-service's own EXPOSE 17105 and
      # /collate endpoint.
      COLLATEX_URL: http://collatex:17105/collate
      # betmas-id-manager isn't profile-gated like the services above - it's
      # a core dependency of edit/save-new-entity.xql now. Internal
      # container port (8080), no public port there, no need.
      ID_MANAGER_URL: http://betmas-id-manager:8080
      # Users will be reset whenever the container gets recreated (no colume for data). So users are
      # exported automatically to a volume and loaded whenever we boot the container
      USERS_VOLUME_DIRECTORY: /betmas-users-data
    volumes:
      - betmas-users-data:/betmas-users-data
  betmas-id-manager:
    image: ghcr.io/betamasaheft/betmas-id-manager:latest
    volumes:
      - betmas-id-manager-data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - betmas

  # `docker compose --profile full up`. No host ports - reached via
  # nginx or directly by server-side app code on the compose network.
  fuseki: # dummy, in-memory; QLever runs side by side (decision #7)
    profiles: [full]
    image: stain/jena-fuseki:latest
    command: ["/jena-fuseki/fuseki-server", "--mem", "/betamasaheft"]

  collatex:
    profiles: [full]
    image: ghcr.io/betamasaheft/collatex-service:main

  qlever: # real SPARQL backend, side by side with dummy fuseki (decision #7)
    profiles: [full]
    image: ghcr.io/betamasaheft/sparql-service:main

  iipsrv: # fixture pyramidal TIFFs baked in, not real scans (#122)
    profiles: [full]
    image: ghcr.io/betamasaheft/iipsrv-fixtures:main

volumes:
  betmas-id-manager-data:
  betmas-users-data:
