     	~*(disco|dittospyder|DomComBot|DotBot/1.1|DotBot/1.2|dotbot|download|downloader|duckduckgo|dumbot|ecatch|eirgrabber|email|emailcollector) 1;
     	~*(emailsiphon|emailwolf|enterprise_search|erocrawler|ev-crawler/1.0|eventmachine|exabot|Expanse|express|extractor|extractorpro|eyenetie) 1;
     	~*(facebookexternalhit/1.1|fairad|flaming|flashget|fluid/0.0|foobot|foto|gaisbot|getright|getty|getweb!|gigabot) 1;
     	~*(go!zilla|go-ahead-got-it|go-http-client|Go-http-client/1.1|Go-http-client/1.1|googlebot|GoogleOther|Googlebot/2.1|bot|Googlebot-Image|gptbot|GPTBot/1.2|grabnet|grafula|grub|hari|harvest|hatena|hloader) 1;
     	~*(Hello-World|Hello-World/1.0|hmview|htmlparser|httplib|httrack|humanlinks|ia_archiver|ImagesiftBot|imagesift|indy|infonavirobot|interget|intraformant) 1;
