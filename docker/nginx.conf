     	~*(navroad|nearsite|nerdybot|netants|netcraft|NetcraftSurveyAgent/1.0|netmechanic|netspider|netzip|nicerspro|ninja|nutch) 1;
     	~*(octopus|Odin|offline|onlyscans|openbot|openfind|openlink|Owler|OWLer|ows.eu/owler|pagegrabber|papa|pavuk|pcbrowser|perl|PetalBot) 1;
     	~*(perman|picscout|propowerbot|prowebwalker|psbot|pycurl|pyq|pyth|python) 1;
     	~*(python-urllib|queryn|quester|radiation|realdownload|reget|retriever|riddler|Riddler|rma|rogerbot|scan|screaming|frog|seo) 1;
     	~*(scooter|searchengineworld|searchpreview|SeekportBot|semrush|semrushbot|semrushbot-sa|SemrushBot/6~bl|seokicks-robot|seznambot|sitesnagger|smartdownload|SonOfAnton|sootle) 1;
     	~*(Smuggler|spankbot|spanner|spbot|spider|stanford|stripper|sucker|superbot|superhttp|surfbot|surveybot) 1;
     	~*(suzuran|szukacz|takeout|teleport|telesoft|thenomad|tocrawl|tool|true_robot|turingos) 1;
     	~*(twengabot|Twitterbot/1.0|twitterbot|typhoeus|url_spider_pro|urldispatcher|urllib|urly|vampire|vci|voideye|warning) 1;
     	~*(webauto|webbandit|webcollector|webcopier|webcopy|webcraw|Web-Crawler|webenhancer|webfetch|webgo|webleacher) 1;
     	~*(webmasterworld|webmasterworldforumbot|webpictures|webreaper|websauger|webspider|webster|webstripper|webvac|Websuse.de/1.0|webviewer) 1;
     	~*(webwhacker|webzip|webzip|wesee|whole-search|wget|widow|woobot|www-collector-e|wwwoffle|xenu|yacybot|yandex|yandex\.eu|YandexFavicons/1.0|YandexImages/3.0|YandexBot/3.0|zgrab/0.x) 1;

}


# Map for empty or invalid user agents
map $http_user_agent $is_empty_ua {
    default 0;
    ""      1;
    "-"     1;
}

# Map for old Chrome versions (1-119)
map $http_user_agent $is_old_chrome {
    default 0;
    "~*Chrome/([1-9]|[1-9][0-9]|1[0-1][0-9])\." 1;
}

# Map for old Firefox versions (1-59)
map $http_user_agent $is_old_firefox {
    default 0;
    "~*Firefox/[1-9]\."                          1;
    "~*Firefox/[1-5][0-9]\."                     1;
}

# cache setup, 
proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=my_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;


server {
	listen 80;
	resolver 127.0.0.11 valid=10s; # for the full-profile upstreams below

	# Dropped when this config was ported from docs/nginx-config
	# (BetMas#157) - without it, nginx doesn't declare a charset on
	# proxied responses, and eXist doesn't declare one itself either, so
	# non-ASCII text (e.g. Ge'ez/Ethiopic manuscript content) can render
	# as mojibake depending on what charset the browser falls back to.
	charset utf-8;

	# Lets eXist detect it's running behind this proxy (controller.xql's
	# local:get-uri(), config:appBase()) so it can tell root-absolute
	# requests apart from ones still carrying the app's own mount path.
	# Applies to every proxied location below via nginx's directive
	# inheritance - none of them set their own proxy_set_header, so this
	# isn't overridden anywhere. Was missing entirely (BetMasWeb#73):
	# request:get-header("nginx-request-uri") never saw anything, so that
	# detection always silently fell back to the mount-path branch.
	proxy_set_header nginx-request-uri $request_uri;

	# Real prod points this at real TIFFs; here it points at iipsrv-fixtures'
	# baked-in synthetic pages, using the same directory/facs-id shape a
	# real Ethio-SPaRe manuscript uses.
	rewrite ^/iiif/(.*) /iipsrv/iipsrv.fcgi?IIIF=/$1 last;

	# eXist sets its session cookie's Path to its own servlet context
	# (/exist), which the browser never sees behind this proxy - without
	# rewriting it here, the cookie is silently dropped on the very next
	# navigation (RFC 6265 path scoping), breaking any login that survives
	# past the response that set it.
	location / {

    		if ($is_empty_ua) { return 444; }

    		#Cache
    		set $skip_cache 0;
    		if ($arg_nocache = '1') {
    		set $skip_cache 1;
    		}
    		if ($http_x_purge_cache) {
    		 set $skip_cache 1;
    		}

    		proxy_cache my_cache;
    		proxy_cache_valid 200 302 1d; # Keep explicit status code limits
    		proxy_cache_bypass $skip_cache;
    		proxy_no_cache $skip_cache;
    		proxy_cache_key "$scheme$request_method$host$request_uri";
    		proxy_ignore_headers Set-Cookie Cache-Control Expires;

		#timeout rules
    		proxy_connect_timeout 5s;
    		proxy_send_timeout 300s;  
    		proxy_read_timeout 300s;  
    		proxy_cache_use_stale error timeout http_502 http_503 http_504;

    		# headers
    		add_header X-Original-URI $uri always;
    		add_header X-Cache-Status $upstream_cache_status always;
    		proxy_pass_header X-Cache-Status;
    		proxy_pass_header X-Cache-Hit;


		proxy_pass http://betmas:8080/exist/apps/BetMasWeb/;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header nginx-request-uri $request_uri;
		proxy_cookie_path /exist/apps/BetMasWeb /;
	}

	#exist backend enabled
	location /exist/ {
    		set $skip_cache 0;
    		if ($arg_nocache = '1') {
    		set $skip_cache 1;
    		}
    		if ($http_x_purge_cache) {
    		 set $skip_cache 1;
    		}

    		proxy_cache my_cache;
    		proxy_cache_valid 200 302 1d; 
    		proxy_cache_bypass $skip_cache;
    		proxy_no_cache $skip_cache;
    		proxy_cache_key "$scheme$request_method$host$request_uri";
    		proxy_ignore_headers Set-Cookie Cache-Control Expires;

		#timeout rules
    		proxy_connect_timeout 5s;
    		proxy_send_timeout 300s;  
    		proxy_read_timeout 300s;  
    		proxy_cache_use_stale error timeout http_502 http_503 http_504;

    		# headers
    		add_header X-Original-URI $uri always;
    		add_header X-Cache-Status $upstream_cache_status always;
    		proxy_pass_header X-Cache-Status;
    		proxy_pass_header X-Cache-Hit;

    		proxy_pass http://betmas:8080/exist/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header nginx-request-uri $request_uri;
		proxy_cookie_path /exist/ /;
}

	# BetMasWeb owns these /api/ routes itself (confirmed against both
	# apps' route tables - zero overlap with BetMasApi). Everything else
	# under /api/ (below) goes to BetMasApi, matching prod's real topology.
	# /api/lists/canonicaltaxonomy.xml is temporary on BetMasWeb and should
	# move to BetMasApi one day (BetMasWeb#89).
	location = /api/collatex {
		proxy_pass http://betmas:8080/exist/apps/BetMasWeb/api/collatex;
		proxy_cookie_path /api/collatex /;
	}

	location = /api/idlookup {
		proxy_pass http://betmas:8080/exist/apps/BetMasWeb/api/idlookup;
		proxy_cookie_path /exist /;
	}

	location = /api/lists/canonicaltaxonomy.xml {
		proxy_pass http://betmas:8080/exist/apps/BetMasWeb/api/lists/canonicaltaxonomy.xml;
		proxy_cookie_path /exist /;
	}

	location /api/ {
		proxy_pass http://betmas:8080/exist/apps/BetMasApi/api/;
		proxy_cookie_path /exist /;
	}

	# Same instance as the main app, not a separate profile-gated
	# container, so no resolver/rewrite trick needed here.
	location /Dillmann/ {

		proxy_pass http://betmas:8080/exist/apps/gez-en/;
		proxy_cookie_path /exist /;
	}

	# betmas-e2e#67: never routed anywhere before this - guidelinesApp's
	# repo.xml target is "guidelines" (lowercase), matching prod's own
	# https://betamasaheft.eu/Guidelines URL despite the case difference.
	location /Guidelines/ {
		proxy_pass http://betmas:8080/exist/apps/guidelines/;
		proxy_cookie_path /exist /;
	}

	# $variable in proxy_pass skips nginx's prefix-stripping - rewrite first.
	location /fuseki/ {
		set $fuseki_upstream fuseki:3030;
		rewrite ^/fuseki/(.*)$ /$1 break;
		proxy_pass http://$fuseki_upstream;
	}

	location /collatex/ {
		set $collatex_upstream collatex:17105;
		rewrite ^/collatex/(.*)$ /$1 break;
		proxy_pass http://$collatex_upstream;
	}

	# No prod precedent (prod's /fuseki/ still serves the old Fuseki);
	# exposed for consistency with the other full-profile services above.
	location /qlever/ {
		set $qlever_upstream qlever:7000;
		rewrite ^/qlever/(.*)$ /$1 break;
		proxy_pass http://$qlever_upstream;
	}

	location /iipsrv/iipsrv.fcgi {
		set $iipsrv_upstream iipsrv:9000;
		fastcgi_pass $iipsrv_upstream;
		fastcgi_param PATH_INFO $fastcgi_script_name;
		fastcgi_param REQUEST_METHOD $request_method;
		fastcgi_param QUERY_STRING $query_string;
		fastcgi_param CONTENT_TYPE $content_type;
		fastcgi_param CONTENT_LENGTH $content_length;
		fastcgi_param SERVER_PROTOCOL $server_protocol;
		fastcgi_param REQUEST_URI $request_uri;
		add_header Access-Control-Allow-Origin *;
	}
}
