     	~*(Turnitin|Linguee|NetcraftSurveyAgent/1.0) 1;
        ~*(node-fetch/1.0|WebSuseBot/1.0|l9explore|l9tcpid|l9scan|Lkx-Apache2449TraversalPlugin) 1;
        ~*(Adsbot/3.1|amazonbot|Amazonbot/0.1|antenna|Applebot/0.1|AwarioBot) 1;
        ~*(AspiegelBot|MegaIndex.ru/2.0|ahrefsbot|alexibot|appengine|aqua_products|archive|asterias|attackbot) 1;
        ~*(b2w|backdoorbot|baidu\.eu|Barkrowler/0.9|becomebot|bing|BingBot|bingbot/2.0|bingbot|bing\.eu|blackwidow|BBBike|blekkobot|BLEXBot/1.0) 1;
     	~*(blowfish|botalot|builtbottough|bullseye|bunnyslippers|bingbot|ccbot|cheesebot|cherrypicker|chinaclaw|chroot|claudebot|ClaudeBot/1.0|clshttp|collector) 1;
