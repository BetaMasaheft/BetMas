name: Bats Tests

# Runs the repo's bats integration suite against an app image built from
# this checkout (docker compose --build), not the published release-expanded
# tag: that tag only rebuilds on master pushes, so it lags behind whatever a
# PR is actually changing - restore-users-from-volume in particular boots the
# betmas service from scratch (--force-recreate) to exercise
# BetMasInitInstance's autodeploy-triggered finish.xq, which only picks up
# a branch's changes if the image's own baked-in /exist/autodeploy was built
# from that branch. Building locally costs a few extra minutes per run but
# is the only way this suite tests the code under review instead of
# whatever last landed on master. app-image-expand.bats contracts
# (EthioStudies / batchExpand) are checked first, then restore-users-from-volume
# (accounts survive redeploy via users volume).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Run bats tests
    runs-on: ubuntu-latest
    # Building the app image locally (rather than pulling the published one)
    # adds real time on top of the ~11GB base layer pull - was fine at 30
    # under pull-only, wider margin now that a build is on the critical path.
    timeout-minutes: 45

    steps:
      # The betmas image built/pulled below is ~11GB+ once layered - the
      # default runner disk is too tight for it alongside everything else.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /var/lib/docker/
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          root-reserve-mb: 4096
          temp-reserve-mb: 1024

      - name: Restart docker
        run: sudo service docker restart

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install bats, ant, xst
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ant zip
          npm install -g @existdb/xst

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: betmas-bot
          password: ${{ secrets.BOT_CONTAINER_PAT }}

      - name: Build and start betmas container
        run: |
          # --build: use the app image built from this checkout (see the
          # workflow-level comment above), not whatever release-expanded
          # last published. The betmas-data base (eXist + indexed corpus)
          # still comes from ghcr - only the app layers (BetMasService,
          # BetMasInitInstance, parser, plus BetMasWeb/BetMasApi/Dillmann/
          # guidelinesApp fetched at their pinned refs) rebuild here.
          docker compose up -d --build betmas

      - name: Wait for eXist to be healthy
        run: |
          timeout 300 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q betmas)" 2>/dev/null)" = "healthy" ]; do
              sleep 2
            done
          '

      - name: Run bats tests
        run: |
          # Read-only image contracts first; restore-users mutates the container.
          npm run test:app-image
          npm run test:restore-users

      - name: Dump betmas logs on failure
        if: failure()
        run: docker compose logs betmas

      - name: Tear down
        if: always()
        run: docker compose down -v
