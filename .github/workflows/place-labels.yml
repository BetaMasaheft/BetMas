name: Place labels catalog

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: BetaMasaheft/expanded
          path: expanded
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan and resolve missing place labels
        env:
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
        run: |
          python3 scripts/place-labels/scan_missing.py \
            --expanded expanded \
            --artifact db/apps/catalogs/place-labels.xml > /tmp/missing.txt
          if [ ! -s /tmp/missing.txt ]; then
            echo "nothing missing"
            exit 0
          fi
          python3 scripts/place-labels/resolve_and_update.py \
            --missing /tmp/missing.txt \
            --artifact db/apps/catalogs/place-labels.xml
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/place-labels-bot
          title: "chore(catalogs): update place-labels artifact"
          body: "HP6 automated resolve (CI network only)."
          commit-message: "chore(catalogs): update place-labels"
